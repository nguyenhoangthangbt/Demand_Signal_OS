# DemandSignalOS web: demand-signal.sim-os.ai (and demand-signal.plan2cash.com
# through the p2c-edge, which sends `X-Site: plan2cash`; no header = sim-os.ai).
# This file is conf.d/default.conf (http context), so the map belongs here.
# On plan2cash.com the page title carries the brand suffix, like the other
# engine landings there (audit 2026-10-12, E-15).
map $http_x_site $title_sfx {
    default   "";
    plan2cash " | Plan2Cash";
}

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html — it points at hashed asset filenames, so it is
    # the only file that changes between deploys. Prevents stale-bundle loads.
    # The served index (also for / and /app) gets the per-site title. The
    # patterns must match web/index.html exactly (tests/seo.test.ts checks).
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
        sub_filter '<title>DemandSignalOS: probabilistic demand forecasting and drift</title>' '<title>DemandSignalOS: probabilistic demand forecasting and drift$title_sfx</title>';
        sub_filter '<meta property="og:title" content="DemandSignalOS: probabilistic demand forecasting and drift" />' '<meta property="og:title" content="DemandSignalOS: probabilistic demand forecasting and drift$title_sfx" />';
    }

    # The page is hash-routed (#leaderboard, ...). /app is kept as an alias of
    # the page for the <engine>.sim-os.ai/app link pattern of the Engines nav.
    location ~ ^/app(/|$) {
        rewrite ^ /index.html last;
    }

    # Anything else: a real file (robots.txt, sitemap.xml, favicons from
    # public/) or a real HTTP 404. The old SPA fallback answered every unknown
    # URL, robots.txt and sitemap.xml with the app HTML and a 200 (audit
    # 2026-10-12, D-22/D-23).
    location / {
        try_files $uri $uri/ =404;
    }

    # nginx's 404s get a small static page with a Home link and noindex. Not
    # reachable by its own URL.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location = /_health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
